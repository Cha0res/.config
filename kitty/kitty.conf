# ~/.config/kitty/kitty.conf

include neofusion.conf

font_family Maple Mono NF
bold_font auto
italic_font auto
font_size 13.0
modify_font cell_height 130%

window_padding_width 12
background_opacity 0.9
background_blur 20
dynamic_background_opacity yes
macos_titlebar_color background

cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.6 ease-in-out
cursor_trail 1
cursor_trail_decay 0.08 0.25
cursor_trail_start_threshold 1
cursor_trail_color #86dbf5

tab_bar_edge top
tab_bar_align center
tab_bar_style powerline
tab_powerline_style slanted

active_tab_foreground #070f1c
active_tab_background #ea6847
inactive_tab_foreground #22536f
inactive_tab_background #070f1c

scrollback_lines 10000
mouse_hide_wait 2
enable_audio_bell no
remember_window_size yes
initial_window_width 1280
initial_window_height 800

update_check_interval 0
