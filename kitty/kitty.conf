# ~/.config/kitty/kitty.conf

include neofusion.conf

font_family Maple Mono NF CN
bold_font auto
italic_font auto
font_size 13.0
modify_font cell_height 130%

window_padding_width 8
dynamic_background_opacity yes
macos_titlebar_color background
background_opacity 0.85
background_blur 25
background_image ~/.config/kitty/gradient.png
background_image_layout scaled
background_tint 0.35

cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.6 ease-in-out
cursor_trail 1
cursor_trail_decay 0.08 0.25
cursor_trail_start_threshold 1
cursor_trail_color #86dbf5

tab_bar_edge top
tab_bar_align center
tab_bar_style powerline
tab_powerline_style slanted

active_tab_foreground #070f1c
active_tab_background #ea6847
inactive_tab_foreground #22536f
inactive_tab_background #070f1c

scrollback_lines 10000
mouse_hide_wait 2
enable_audio_bell no
remember_window_size yes
initial_window_width 1280
initial_window_height 800

update_check_interval 0

# >>> kitty-terminal-pets >>>
# Local Unix sockets only: pet management never shares the keyboard TTY.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-pet-501/kitty-pet-{kitty_pid}.sock

# Borderless internal rail; native OS window decorations are untouched.
window_border_width 0
draw_minimal_borders yes
draw_window_borders_for_single_window no

map ctrl+shift+f8 launch --type=overlay --title="Select terminal pet" /Users/cha0res/.local/bin/kitty-pet select
map ctrl+shift+f7 launch --type=background /Users/cha0res/.local/bin/kitty-pet toggle
# <<< kitty-terminal-pets <<<
