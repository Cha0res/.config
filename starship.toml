"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$line_break\
$character"""

right_format = """
$nodejs\
$python\
$rust\
$golang\
$swift\
$kubernetes\
$battery\
$cmd_duration\
$time"""

add_newline = false

[fill]
symbol = " "

[username]
show_always = true
style_user = "bold #b4a7d6"
style_root = "bold #c97b7b"
format = '[$user]($style) '

[directory]
style = "bold #a4c4d7"
format = '[$path]($style)'
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"~/Code" = " "
"~/Workspace" = " "
"~/Documents" = "󰈙 "
"~/Downloads" = " "
"~/Desktop" = "󰇄 "

[git_branch]
symbol = " "
style = "bold #a8d5ba"
format = ' [$symbol$branch]($style)'

[git_status]
style = "#f4b6a0"
format = ' [$all_status$ahead_behind]($style)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = '\$${count}'
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[❯](bold #7a9e7e)"
error_symbol = "[❯](bold #c97b7b)"
vicmd_symbol = "[❮](bold #d4b87e)"

[nodejs]
symbol = " "
style = "#f5cba7"
format = '[$symbol$version]($style) '
detect_files = ["package.json", ".nvmrc"]
detect_folders = ["node_modules"]
detect_extensions = []

[python]
symbol = " "
style = "#f5cba7"
format = '[$symbol$version]($style) '
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", "Pipfile", ".python-version"]
detect_extensions = []

[rust]
symbol = " "
style = "#f5cba7"
format = '[$symbol$version]($style) '
detect_files = ["Cargo.toml"]
detect_extensions = []

[golang]
symbol = " "
style = "#f5cba7"
format = '[$symbol$version]($style) '
detect_files = ["go.mod", "go.sum"]
detect_extensions = []

[swift]
symbol = " "
style = "#f5cba7"
format = '[$symbol$version]($style) '
detect_files = ["Package.swift"]
detect_extensions = []

[kubernetes]
disabled = false
symbol = "☸ "
style = "#a3c9a8"
format = '[$symbol$context(\($namespace\))]($style) '

[[kubernetes.contexts]]
context_pattern = ".*"

[battery]
disabled = false
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰁾 "
format = '[$symbol$percentage]($style) '

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 40
style = "yellow"

[cmd_duration]
min_time = 2_000
style = "#d4b87e"
format = '[ $duration]($style) '

[time]
disabled = false
time_format = "%R"
style = "#b4a7d6"
format = '[$time]($style)'

